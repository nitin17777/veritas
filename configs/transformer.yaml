# VERITAS Transformer Baseline Configuration
# Supports any Hugging Face Sequence Classification model.

paths:
  results_dir: results

logging:
  level: INFO

baseline_transformer:
  dataset: liar
  processed_dir: data/processed/liar
  model_name_or_path: "distilroberta-base"
  random_seed: 42

  # Tokenization
  max_seq_length: 128

  # Class imbalance strategy: "balanced" | "inverse_freq" | "none"
  imbalance_strategy: "balanced"

  # Training hyperparameters (Hugging Face TrainingArguments)
  training:
    learning_rate: 3.0e-5
    per_device_train_batch_size: 16
    per_device_eval_batch_size: 32
    gradient_accumulation_steps: 1
    num_train_epochs: 3
    weight_decay: 0.01
    warmup_ratio: 0.1
    eval_strategy: "epoch"
    save_strategy: "epoch"
    load_best_model_at_end: true
    metric_for_best_model: "macro_f1"
    greater_is_better: true
    save_total_limit: 2
    logging_steps: 50
    fp16: false      # auto-enabled at runtime if CUDA is available
    dataloader_num_workers: 0

  # Smoke test overrides (activated via --smoke-test)
  smoke_test:
    max_train_samples: 32
    max_eval_samples: 16
    max_test_samples: 16
    num_train_epochs: 1
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 8
    logging_steps: 2
