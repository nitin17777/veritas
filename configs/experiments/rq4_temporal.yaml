# =============================================================================
# RQ4: Temporal Scoring Experiment
# Evaluates temporal alignment using exponential decay exp(-delta_days / tau).
# =============================================================================

experiment:
  name: rq4_temporal
  research_question: RQ4
  description: "Evidence re-ranking with temporal decay alignment (gamma=0.15)"
  comparison_factor: "temporal_scoring"
  factor_value: "enabled"
  seed: 42
  version: "1.0"

dataset:
  name: liar
  version: "v1.0"
  split: test
  path: data/processed/liar_test.jsonl

paths:
  results_dir: results/experiments

pipeline:
  retrieval_mode: bm25
  retrieval_top_k: 10
  save_verdicts: true

retrieval:
  mode: bm25
  bm25:
    index_dir: data/indexes/bm25_default
    bm25_top_k: 50

scoring:
  weights:
    alpha: 0.60
    beta: 0.25
    gamma: 0.15
  normalize_weights: true
  credibility:
    tier_config_path: "configs/credibility_tiers.yaml"
    unknown_domain_score: 0.50
    random_mode: false
    random_seed: 42
  temporal:
    default_tau: 180.0
    neutral_score: 0.50

verification:
  backend: mock
  model: mock-model
  temperature: 0.0
  max_tokens: 512
  prompt_mode: evidence_constrained
  abstain_label: Unverified
  save_traces: true

smoke_test:
  enabled: false
  max_claims: 20
