# =============================================================================
# RQ7: Abstention Disabled (Flag-Only) Experiment
# Preserves raw verifier verdicts without abstention downgrades.
# =============================================================================

experiment:
  name: rq7_no_abstention
  research_question: RQ7
  description: "Faithfulness checking in flag-only mode (no verdict downgrades)"
  comparison_factor: "abstention_policy"
  factor_value: "flag_only"
  seed: 42
  version: "1.0"

dataset:
  name: liar
  version: "v1.0"
  split: test
  path: data/processed/liar_test.jsonl

paths:
  results_dir: results/experiments

pipeline:
  retrieval_mode: bm25
  retrieval_top_k: 10
  save_verdicts: true

retrieval:
  mode: bm25
  bm25:
    index_dir: data/indexes/bm25_default
    bm25_top_k: 50

verification:
  backend: mock
  model: mock-model
  temperature: 0.0
  max_tokens: 512
  prompt_mode: evidence_constrained
  abstain_label: Unverified
  save_traces: true

faithfulness:
  nli_model_name: mock
  entailment_threshold: 0.5
  min_confidence: 0.60
  min_faithfulness: 0.70
  mode: flag_only
  abstain_label: Unverified

smoke_test:
  enabled: false
  max_claims: 20
