# =============================================================================
# VERITAS Base Experiment Configuration
# =============================================================================

experiment:
  name: base
  research_question: Base
  description: "Base configuration providing shared defaults for experiments"
  comparison_factor: ""
  factor_value: null
  seed: 42
  version: "1.0"

dataset:
  name: liar
  version: "v1.0"
  split: test
  path: data/processed/liar_test.jsonl

paths:
  results_dir: results/experiments
  indexes_dir: data/indexes

pipeline:
  retrieval_mode: bm25
  retrieval_top_k: 10
  save_verdicts: true

retrieval:
  mode: bm25
  bm25:
    index_dir: data/indexes/bm25_default
    bm25_top_k: 50
    k1: 1.5
    b: 0.75
  dense:
    index_dir: data/indexes/dense_default
    dense_top_k: 50
    model_name_or_path: "BAAI/bge-small-en-v1.5"
    device: "auto"
    normalize_embeddings: true
  hybrid:
    rrf_constant: 60

scoring:
  weights:
    alpha: 0.60
    beta: 0.25
    gamma: 0.15
  normalize_weights: true
  credibility:
    tier_config_path: "configs/credibility_tiers.yaml"
    unknown_domain_score: 0.50
    random_mode: false
    random_seed: 42
  temporal:
    default_tau: 180.0
    neutral_score: 0.50

verification:
  backend: mock
  model: mock-model
  temperature: 0.0
  max_tokens: 512
  prompt_mode: evidence_constrained
  allow_no_evidence: false
  abstain_label: Unverified
  min_relevance_score: null
  max_evidence_passages: 10
  save_traces: true
  trace_dir: results/experiments/traces

faithfulness:
  nli_model_name: mock
  entailment_threshold: 0.5
  min_confidence: 0.6
  min_faithfulness: 0.5
  mode: abstain
  abstain_label: Unverified

smoke_test:
  enabled: false
  max_claims: 20
