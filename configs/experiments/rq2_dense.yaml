# =============================================================================
# RQ2: Dense Semantic Retrieval Experiment
# =============================================================================

experiment:
  name: rq2_dense
  research_question: RQ2
  description: "Dense semantic vector retrieval"
  comparison_factor: "retrieval_mode"
  factor_value: "dense"
  seed: 42
  version: "1.0"

dataset:
  name: liar
  version: "v1.0"
  split: test
  path: data/processed/liar_test.jsonl

paths:
  results_dir: results/experiments

pipeline:
  retrieval_mode: dense
  retrieval_top_k: 10
  save_verdicts: true

retrieval:
  mode: dense
  dense:
    index_dir: data/indexes/dense_default
    dense_top_k: 50

verification:
  backend: mock
  model: mock-model
  temperature: 0.0
  max_tokens: 512
  prompt_mode: evidence_constrained
  abstain_label: Unverified
  save_traces: true

smoke_test:
  enabled: false
  max_claims: 20
