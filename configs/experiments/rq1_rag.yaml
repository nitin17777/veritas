# =============================================================================
# RQ1: RAG-based Fact Verification Experiment
# Tests retrieval-augmented verification against the LLM-only baseline.
# =============================================================================

experiment:
  name: rq1_rag
  research_question: RQ1
  description: "Standard Retrieval-Augmented Generation (RAG) fact verification"
  comparison_factor: "retrieval_mode"
  factor_value: "bm25"
  seed: 42
  version: "1.0"

dataset:
  name: liar
  version: "v1.0"
  split: test
  path: data/processed/liar_test.jsonl

paths:
  results_dir: results/experiments

pipeline:
  retrieval_mode: bm25
  retrieval_top_k: 10
  save_verdicts: true

retrieval:
  mode: bm25
  bm25:
    index_dir: data/indexes/bm25_default
    bm25_top_k: 50

verification:
  backend: mock
  model: mock-model
  temperature: 0.0
  max_tokens: 512
  prompt_mode: evidence_constrained
  allow_no_evidence: false
  abstain_label: Unverified
  save_traces: true

smoke_test:
  enabled: false
  max_claims: 20
