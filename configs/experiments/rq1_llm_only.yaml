# =============================================================================
# RQ1: LLM-only Baseline Experiment
# Tests verification using parametric knowledge alone without retrieval.
# =============================================================================

experiment:
  name: rq1_llm_only
  research_question: RQ1
  description: "LLM parametric knowledge verification without external retrieval"
  comparison_factor: "retrieval_mode"
  factor_value: "none"
  seed: 42
  version: "1.0"

dataset:
  name: liar
  version: "v1.0"
  split: test
  path: data/processed/liar_test.jsonl

paths:
  results_dir: results/experiments

pipeline:
  retrieval_mode: none
  retrieval_top_k: 0
  save_verdicts: true

retrieval:
  mode: none

verification:
  backend: mock
  model: mock-model
  temperature: 0.0
  max_tokens: 512
  prompt_mode: free
  allow_no_evidence: true
  abstain_label: Unverified
  save_traces: true

smoke_test:
  enabled: false
  max_claims: 20
