# =============================================================================
# RQ5: Free Unconstrained Prompt Experiment
# Allows model to rely on pre-trained parametric knowledge without closed-world rules.
# =============================================================================

experiment:
  name: rq5_free_prompt
  research_question: RQ5
  description: "Free unconstrained prompt allowing general world knowledge"
  comparison_factor: "prompt_mode"
  factor_value: "free"
  seed: 42
  version: "1.0"

dataset:
  name: liar
  version: "v1.0"
  split: test
  path: data/processed/liar_test.jsonl

paths:
  results_dir: results/experiments

pipeline:
  retrieval_mode: bm25
  retrieval_top_k: 10
  save_verdicts: true

retrieval:
  mode: bm25
  bm25:
    index_dir: data/indexes/bm25_default
    bm25_top_k: 50

verification:
  backend: mock
  model: mock-model
  temperature: 0.0
  max_tokens: 512
  prompt_mode: free
  allow_no_evidence: true
  abstain_label: Unverified
  save_traces: true

smoke_test:
  enabled: false
  max_claims: 20
