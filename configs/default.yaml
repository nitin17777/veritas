project:
  name: VERITAS
  seed: 42

paths:
  results_dir: results

logging:
  level: INFO

data_prep:
  raw_dir: data/raw
  processed_dir: data/processed
  datasets:
    - liar

retrieval:
  mode: hybrid
  bm25:
    backend: bm25
    index_dir: data/indexes/bm25_default
    bm25_top_k: 50
    k1: 1.5
    b: 0.75
    chunk_size: 150
    chunk_overlap: 20
  dense:
    backend: dense
    index_dir: data/indexes/dense_default
    model_name_or_path: "BAAI/bge-small-en-v1.5"
    device: "auto"
    batch_size: 32
    normalize_embeddings: true
    index_type: "IndexFlatIP"
    dense_top_k: 50
  hybrid:
    rrf_constant: 60
  datasets:
    - rawfc
    - averitec
    - custom_recent

verification:
  backend: mock
  model: mock-model
  temperature: 0.0
  max_tokens: 512
  abstain_label: Unverified
  min_relevance_score: null
  max_evidence_passages: 10
  save_traces: true
  trace_dir: results/verification_traces