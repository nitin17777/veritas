# VERITAS Dense Retrieval Configuration (SentenceTransformers + FAISS)
project:
  name: VERITAS
  seed: 42

paths:
  results_dir: results

logging:
  level: INFO

retrieval:
  backend: dense
  index_dir: data/indexes/dense_default
  model_name_or_path: "BAAI/bge-small-en-v1.5"
  device: "auto"
  batch_size: 32
  normalize_embeddings: true
  index_type: "IndexFlatIP"
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""
  dense_top_k: 50
  datasets:
    - rawfc
    - averitec
    - custom_recent
