# VERITAS Hybrid Retrieval Configuration (BM25 + Dense + RRF)
project:
  name: VERITAS
  seed: 42

paths:
  results_dir: results

logging:
  level: INFO

retrieval:
  mode: hybrid
  bm25:
    backend: bm25
    index_dir: data/indexes/bm25_default
    bm25_top_k: 50
    k1: 1.5
    b: 0.75
  dense:
    backend: dense
    index_dir: data/indexes/dense_default
    model_name_or_path: "BAAI/bge-small-en-v1.5"
    device: "auto"
    batch_size: 32
    normalize_embeddings: true
    dense_top_k: 50
  hybrid:
    rrf_constant: 60
    top_k: 50
    weights:
      bm25: 1.0
      dense: 1.0
  datasets:
    - rawfc
    - averitec
    - custom_recent
